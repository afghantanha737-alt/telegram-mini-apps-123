<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مینی اپ پوینت</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header>
    <div id="avatar">A</div>
    <div id="headerInfo">
      <div id="greetName">سلام 👋</div>
      <div id="pointsDisplay">۰ پوینت</div>
    </div>
  </header>

  <main id="content"></main>

  <nav id="tabbar">
    <button data-tab="home"><span class="tabIcon">🏠</span><span>خانه</span></button>
    <button data-tab="tasks"><span class="tabIcon">✅</span><span>تسک‌ها</span></button>
    <button data-tab="referral"><span class="tabIcon">🔗</span><span>رفرال</span></button>
    <button data-tab="points"><span class="tabIcon">💎</span><span>پوینت‌ها</span></button>
  </nav>
</div>

<div id="captchaOverlay" style="display:none;">
  <div class="captchaBox">
    <div class="captchaIcon">🔒</div>
    <h3>یه لحظه، فقط می‌خوایم مطمئن شیم ربات نیستی</h3>
    <p id="captchaQuestion" class="captchaQ">...</p>
    <input id="captchaAnswer" type="number" placeholder="جواب رو اینجا بنویس">
    <button class="action" onclick="submitCaptcha()">تایید</button>
    <p id="captchaError" class="captchaErr"></p>
  </div>
</div>

<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
